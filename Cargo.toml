[workspace]
resolver = "2"
members = ["crates/core", "crates/submit", "crates/server", "crates/frontend"]

[workspace.package]
edition = "2024"
version = "0.2.0"

[workspace.dependencies]
# Internal crates.
recibase-core = { path = "crates/core" }
recibase-submit = { path = "crates/submit" }

# External crates.
chrono = "0.4"
csv = "1"
diesel = { version = "2", features = ["postgres", "chrono", "r2d2"] }
diesel_migrations = "2"
getrandom = "0.2"
jsonwebtoken = "9"
markdown = "1"
minijinja = "2.24"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
unicode-normalization = "0.1"
ureq = { version = "3", default-features = false, features = ["json"] }


[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = false
lto = true
opt-level = 3
strip = true
