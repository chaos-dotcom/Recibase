# Compose file for the Recibase Rust service: the API and the frontend.
#
#   cp .env.example .env          # optional: configure usage data / submissions
#   docker compose up --build     # start
#   curl localhost:8081/health    # -> ok
#   open http://localhost:8080/   # the website
#
# The build context for both is this directory (where Cargo.toml lives). See the
# Dockerfile for the API's image targets and crates/frontend/Dockerfile for the
# frontend's.
services:
  recibase:
    build:
      context: .
      # `runtime` is the glibc slim image and carries the image HEALTHCHECK, so
      # `docker compose up --wait` reports healthy. Swap to `distroless` for the
      # smallest image (~51 MB); it has no shell, so it has no HEALTHCHECK.
      target: runtime
    image: recibase-rust:slim
    # The container listens on PORT, which the image defaults to 8081. If you
    # change PORT in .env, change the port mapping below to match.
    ports:
      - "8081:8081"
    # Optional; every variable in it is documented in .env.example. A missing
    # file is fine (the server then runs with an empty meal log and the
    # submission route answering 503, like the unconfigured Scala).
    env_file:
      - path: .env
        required: false
    # To serve a local meal log, mount it and set MEAL_LOG_CSV_URL in .env:
    # volumes:
    #   - ./meal-log.csv:/data/meal-log.csv:ro
    restart: unless-stopped

  # The website: the frontend ported from Flask.
  #
  #   docker compose up --build        # the API and the website
  #   docker compose up frontend       # the same, and it waits for the API
  #
  # It renders the pages itself and proxies the API for the rest, so these two
  # services are everything reciba.se needs. To serve the website against an API
  # somewhere else, leave this project alone and run the image on its own:
  #
  #   docker build -f crates/frontend/Dockerfile -t recibase-frontend:slim .
  #   docker run --rm -p 8080:8080 -e BACKEND_URL=https://api.reciba.se/ \
  #       recibase-frontend:slim
  frontend:
    build:
      context: .
      dockerfile: crates/frontend/Dockerfile
      # `runtime` is the glibc slim image and carries the image HEALTHCHECK, so
      # `docker compose up --wait` reports healthy. Swap to `distroless` for the
      # smallest image; it has no shell, so it has no HEALTHCHECK.
      target: runtime
    image: recibase-frontend:slim
    # The container listens on PORT, which the image defaults to 8080.
    ports:
      - "8080:8080"
    environment:
      # Handed to the browser in /manifest.json, so it must be an address the
      # browser can reach - not the compose service name, which only resolves
      # inside this network. Set it in .env, or in the environment, to point the
      # website at an API that is not in this project.
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8081/}
    # Wait for the API to answer /health rather than just for the container to
    # exist, or the first page a visitor asks for is the 503 one.
    depends_on:
      recibase:
        condition: service_healthy
    restart: unless-stopped
