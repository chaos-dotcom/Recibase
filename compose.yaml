services:
  recibase:
    build:
      context: .
      target: runtime
      # Baked into the binary by crates/server/build.rs, so /manifest reports the
      # commit. `docker compose build` takes these from the environment (and
      # `.env`); unset means the manifest shows `latest`.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        GITHUB_SHA: ${GITHUB_SHA:-}
    image: recibase-rust:slim
    env_file:
      - path: .env
        required: false
    # The admin tracker's store. Unset in production it falls back to this
    # compose database; point `DATABASE_URL` at an external one to opt out.
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://recibase:${POSTGRES_PASSWORD:-recibase}@db:5432/recibase}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - apps-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=apps-internal"
      - "traefik.http.routers.recibase-api.rule=Host(`${RECIBASE_API_HOST:-api.recibase.shed.gay}`)"
      - "traefik.http.routers.recibase-api.entrypoints=websecure"
      - "traefik.http.routers.recibase-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-myresolver}"
      - "traefik.http.services.recibase-api.loadbalancer.server.port=8081"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recibase
      POSTGRES_USER: recibase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recibase}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recibase -d recibase"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: crates/frontend/Dockerfile
      target: runtime
      # Baked into the binary by crates/frontend/build.rs, so the footer reads
      # `v<hash>`. `docker compose build` takes these from the environment (and
      # `.env`); unset means the footer shows `latest`.
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        GITHUB_SHA: ${GITHUB_SHA:-}
    image: recibase-frontend:slim
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8081/}
      # Other deployments to list alongside ours: `label|api|site`, `;`-separated.
      PEER_BACKENDS: ${PEER_BACKENDS:-}
      # This deployment's own server for the recipe caption: `label|site`.
      SERVER_IDENTITY: ${SERVER_IDENTITY:-}
    depends_on:
      recibase:
        condition: service_healthy
    networks:
      - default
      - apps-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=apps-internal"
      - "traefik.http.routers.recibase.rule=Host(`${RECIBASE_HOST:-recibase.shed.gay}`)"
      - "traefik.http.routers.recibase.entrypoints=websecure"
      - "traefik.http.routers.recibase.tls.certresolver=${TRAEFIK_CERTRESOLVER:-myresolver}"
      - "traefik.http.services.recibase.loadbalancer.server.port=8080"
    restart: unless-stopped

networks:
  default:
  apps-internal:
    external: true

volumes:
  db-data:
